[project]
name = "tickr-web"
version = "0.1.0"
description = "tickr.bot web app: sign-in, cabinet and waitlist (Django + Postgres)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "django[argon2]>=5.2,<6",
  "django-allauth[mfa,idp-oidc]>=65.23",
  "psycopg[binary]>=3.2",
  "gunicorn>=23",
  "django-ses>=4.4",
  # allauth.idp.oidc imports requests but its idp-oidc extra does not list it.
  "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tickrweb.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
# The repository's rules, so `ruff check .` at the root and here agree.
extend = "../pyproject.toml"
