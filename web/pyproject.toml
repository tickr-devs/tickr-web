[project]
name = "tickr-web"
version = "0.1.0"
description = "tickr.bot web app: sign-in, cabinet and waitlist (Django + Postgres)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "django[argon2]>=5.2,<7",
  "django-allauth[mfa]>=65.23,<66",
  "psycopg[binary]>=3.2",
  "gunicorn>=23",
  "django-ses>=4.4",
  # Signs the bot grants the apps get after signing in (tickrweb/grants.py).
  "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tickrweb.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
# The same rules tickr-bot uses (copied at the split; there is no root pyproject here any more).
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The site builder holds whole HTML templates; their lines stay as the markup is.
"site/build.py" = ["E501"]
