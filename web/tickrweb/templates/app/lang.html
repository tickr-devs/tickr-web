{% load i18n %}{% get_current_language as LANG %}{# EN / ES switch: Django's set_language, a plain form (the CSP allows no inline script). #}
<form class="seg" method="post" action="{% url 'set_language' %}" aria-label="{% translate 'Language' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit" name="language" value="en" lang="en" aria-pressed="{% if LANG == 'en' %}true{% else %}false{% endif %}">EN</button><button type="submit" name="language" value="es" lang="es" aria-pressed="{% if LANG == 'es' %}true{% else %}false{% endif %}">ES</button></form>
