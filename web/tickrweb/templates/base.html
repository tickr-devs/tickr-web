{% load i18n static %}<!DOCTYPE html>
{% get_current_language as LANG %}
<html lang="{{ LANG }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#05070F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#E9EDF7" media="(prefers-color-scheme: light)">
<title>{% block head_title %}{% endblock %} · tickr.bot</title>
<link rel="stylesheet" href="{% static 'web/app.css' %}">
<script src="{% static 'web/app.js' %}" defer></script>
{% block extra_head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
{% block extra_body %}{% endblock %}
</body>
</html>
